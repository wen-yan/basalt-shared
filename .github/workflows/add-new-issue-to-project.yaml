name: add new issue to project
on:
  issues:
    types: [opened]

jobs:
  add-issue-to-project:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add issue to project
        uses: ./.github/actions/auto-add-issue-to-project
        with:
          github-token: ${{ secrets.WORKFLOW_AUTO_ADD_NEW_ISSUES_TO_PROJECT_PAT }}
